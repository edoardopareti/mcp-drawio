[project]
name = "drawio-nl-agent"
version = "4.0.0"
description = "Create and edit draw.io diagrams through natural language via an MCP agent"
requires-python = ">=3.11"

[tool.setuptools.package-data]
drawio_agent = ["catalog/seeds/*.json", "notations/definitions/*.json", "notations/definitions/*.md"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
